[project]
name = "tf2-classifier-fashion-mnist-custom-training-loop"
version = "0.1.0"
description = "ResNet-style classifier for Fashion-MNIST built with custom layers, model subclassing and a custom training loop in TensorFlow 2."
readme = "README.md"
authors = [
    { name = "Diego Ramirez Rosas", email = "ramirezgrosas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "tensorflow>=2.21.0",
]

[project.scripts]
tf2-classifier-fashion-mnist-custom-training-loop = "tf2_classifier_fashion_mnist_custom_training_loop:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
